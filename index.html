<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		  content="width=device-width, initial-scale=1.0">
	<title>Lancer Roadmap</title>
	<script>
	(() => {
		const storedTheme = localStorage.getItem("lancer-roadmap-theme");
		const theme = ["gms-light", "gms-dark"].includes(storedTheme)
			? storedTheme
			: window.matchMedia("(prefers-color-scheme: dark)").matches
				? "gms-dark"
				: "gms-light";

		document.documentElement.dataset.theme = theme;
	})();
	</script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
	<header>
		<div id="header-buttons">
			<button data-id="tutorial">Tutorial</button>
			<button data-id="lcps">Non-Core Content</button>
			<button data-id="contact">Contact</button>
			<button data-id="license">License</button>
		</div>
		<div id="title">Lancer Roadmap</div>
		<img class="license-mark light"
			src="src/assets/lancer_light.svg"
			alt="Lancer Third Party License">
		<img class="license-mark dark"
			src="src/assets/lancer_dark.svg"
			alt="Lancer Third Party License">
	</header>
	<main id="app">
		<section id="menu-bar">
			<input id="roadmap-name"
				   type="text">

			<label id="max-ll-select">
				Maximum LL
				<input id="roadmap-max-level"
					   type="number"
					   min="0"
					   max="12"
					   step="1">
			</label>

			<details id="lcp-manager">
				<summary>
					LCPs
					<span id="lcp-count">0</span>
				</summary>
				<div id="lcp-panel">
					<input id="lcp-file"
						   class="visually-hidden"
						   type="file"
						   accept=".lcp,application/zip">
					<ul id="lcp-packages"></ul>
					<output id="lcp-status"
							aria-live="polite"></output>
				</div>
			</details>

			<label class="menu-btn theme-toggle">
				<input id="theme-toggle"
					   class="menu-btn-input"
					   type="checkbox"
					   role="switch"
					   aria-label="Toggle GMS color theme">
				<strong class="theme-name"></strong>
			</label>

			<label class="menu-btn">
				<input id="exotics-toggle"
					   class="menu-btn-input exotics-btn-input"
					   type="checkbox"
					   role="switch"
					   aria-label="Enable/disable exotic components">
				<span class="exotics-slider"></span>
				<strong class="exotics-name"></strong>
			</label>

			<button id="load-btn"
					class="menu-btn"
					title="Load roadmap from file">
				<i class="fa fa-folder-open"></i>
			</button>
			<input id="roadmap-file"
					type="file"
					accept=".json,application/json"
					hidden>

			<button id="save-btn"
					class="menu-btn"
					title="Save roadmap to file">
				<i class="fa fa-save"></i>
			</button>
		</section>
		<section id="roadmap-shell" class="roadmap-shell">
			<aside class="level-rail">
			</aside>

			<div class="roadmap-container">
				<div class="roadmap-table-track">
					<table id="roadmap-table" class="roadmap-table">
						<thead>
							<tr>
								<th scope="col"><span>Level Up</span></th>
								<th scope="col"><span>Active Frame</span></th>
								<th scope="col"><span>Stats</span></th>
								<th scope="col"><span>Systems</span></th>
								<th scope="col"><span>Mounts</span></th>
							</tr>
						</thead>
						<tbody id="roadmap-body"></tbody>
					</table>
				</div>
			</div>
		</section>
	</main>
	<div id="modal-layer" hidden>
		<div id="modal-dialog">
			<div id="modal-header">
				<span id="modal-title"></span>
			</div>
			<div id="modal-body"></div>
		</div>
	</div>
	<div id="selector-overlay">
		<div id="selector-info-bubble" hidden></div>
	</div>

	<script type="module" src="/src/main.js"></script>
</body>
</html>
