name: deploy-lancer-roadmap
run-name: Lancer Roadmap
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure GitHub
        uses: actions/configure-pages@v5

      - name: Upload built application
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  cleanup:
    name: Delete old deployments
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      deployments: write

    steps:
      - name: Mark previous deployments inactive and delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t old_deployments < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GH_REPO/deployments?environment=github-pages&per_page=100" \
              --jq '.[] | [.id, .created_at] | @tsv' |
            sort -t$'\t' -k2,2r |
            tail -n +2 |
            cut -f1
          )

          for deployment_id in "${old_deployments[@]}"; do
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GH_REPO/deployments/$deployment_id/statuses" \
              -f state=inactive \
              >/dev/null
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GH_REPO/deployments/$deployment_id"
          done